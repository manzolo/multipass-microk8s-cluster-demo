name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job veloce: verifica sintassi e linting
  lint:
    name: Bash Syntax & Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check bash syntax for all scripts
        run: |
          echo "Checking bash syntax..."
          errors=0
          for script in $(find . -name "*.sh" -type f); do
            if ! bash -n "$script" 2>&1; then
              echo "❌ Syntax error in: $script"
              errors=$((errors + 1))
            else
              echo "✓ $script"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors scripts with syntax errors"
            exit 1
          fi
          echo "All scripts passed syntax check!"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on main scripts
        run: |
          echo "Running shellcheck..."
          shellcheck -e SC1091,SC2034,SC2154 \
            menu.sh \
            create_kube_vms.sh \
            destroy_kube_vms.sh \
            script/functions/*.sh \
            script/menu/*.sh \
            || true  # Non fallire per ora, solo warning

  # NOTE: Integration test with Multipass is not possible on GitHub Actions
  # because hosted runners don't support hardware virtualization.
  # Run integration tests locally with: ./create_kube_vms.sh
